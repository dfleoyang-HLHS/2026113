<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級座位表</title><style>:root{--bg:#f6f8fc;--ink:#172033;--muted:#64748b;--blue:#e0f2fe;--pink:#fce7f3;--line:#dbe3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{text-align:center;padding:24px 12px 14px}h1{margin:0 0 5px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto 16px}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}button.primary{background:#2563eb;color:white}.status{text-align:center;color:var(--muted);min-height:24px}.error{color:#dc2626}.room{width:min(1200px,95vw);margin:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.front{text-align:center;background:#172033;color:#fff;border-radius:8px;padding:9px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(88px,1fr));gap:8px}.seat{min-height:100px;border:2px dashed #cbd5e1;border-radius:12px;padding:8px;touch-action:none;user-select:none}.seat.boy{background:var(--blue)}.seat.girl{background:var(--pink)}.seat.empty{display:grid;place-items:center;color:#94a3b8}.seat.dragging{opacity:.35}.seat.over{outline:3px solid #2563eb}.num,.meta{font-size:12px;color:var(--muted)}.name{font-weight:800;font-size:17px;margin:5px 0}.legend{margin-top:14px;color:var(--muted);font-size:13px}@media(max-width:650px){.grid{gap:5px}.seat{min-height:86px;padding:6px}.name{font-size:14px}}@media print{.toolbar,.legend,.status{display:none}body{background:#fff}.room{width:100%;border:0;box-shadow:none}}</style></head><body><header><h1 id="title">班級座位表</h1><div id="info"></div></header><div class="toolbar"><button class="primary" id="save">確認並儲存（本地）</button><button id="push">上傳最新版本到 GitHub</button><button id="export">下載 Excel 座位表</button><button id="print">列印 / 存 PDF</button><button id="setup">重新設定教室</button><button id="reset">恢復預設排列</button><span class="status" id="status"></span></div><section class="room"><div class="front">講台／黑板</div><div class="grid" id="grid"></div><div class="legend">男生：淺藍色｜女生：淺粉紅色｜手機：長按後拖曳</div></section><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>const STUDENTS=[{"no": 1, "className": "301", "seatNo": "03", "name": "余賽亞", "studentId": "310273"}, {"no": 2, "className": "301", "seatNo": "04", "name": "吳宇昕", "studentId": "310274"}, {"no": 3, "className": "301", "seatNo": "09", "name": "林子辰", "studentId": "310014"}, {"no": 4, "className": "301", "seatNo": "10", "name": "鍾黃保", "studentId": "310303"}, {"no": 5, "className": "301", "seatNo": "20", "name": "馮靖翔", "studentId": "310259"}, {"no": 6, "className": "301", "seatNo": "26", "name": "鄧智城", "studentId": "310100"}, {"no": 7, "className": "302", "seatNo": "02", "name": "吳沁祐", "studentId": "310275"}, {"no": 8, "className": "302", "seatNo": "05", "name": "李孟蒝", "studentId": "310175"}, {"no": 9, "className": "302", "seatNo": "06", "name": "林辰恩", "studentId": "310017"}, {"no": 10, "className": "302", "seatNo": "08", "name": "林秉翰", "studentId": "310113"}, {"no": 11, "className": "302", "seatNo": "16", "name": "郭紘銘", "studentId": "310091"}, {"no": 12, "className": "302", "seatNo": "17", "name": "陳宇傑", "studentId": "310151"}, {"no": 13, "className": "303", "seatNo": "06", "name": "李翊勤", "studentId": "310109"}, {"no": 14, "className": "303", "seatNo": "07", "name": "卓子皓", "studentId": "310110"}, {"no": 15, "className": "303", "seatNo": "15", "name": "莊英濠", "studentId": "310185"}, {"no": 16, "className": "303", "seatNo": "24", "name": "楊晉承", "studentId": "310231"}, {"no": 17, "className": "304", "seatNo": "08", "name": "林兆銓", "studentId": "310179"}, {"no": 18, "className": "304", "seatNo": "14", "name": "洪睿遠", "studentId": "310281"}, {"no": 19, "className": "304", "seatNo": "15", "name": "孫大鈞", "studentId": "310022"}, {"no": 20, "className": "304", "seatNo": "17", "name": "馬翌友", "studentId": "310250"}, {"no": 21, "className": "304", "seatNo": "21", "name": "盛羨", "studentId": "310223"}, {"no": 22, "className": "304", "seatNo": "27", "name": "黃國威", "studentId": "310292"}, {"no": 23, "className": "304", "seatNo": "29", "name": "潘韋廷", "studentId": "310197"}, {"no": 24, "className": "305", "seatNo": "25", "name": "楊宗諺", "studentId": "310264"}, {"no": 25, "className": "306", "seatNo": "08", "name": "李家翔", "studentId": "310040"}, {"no": 26, "className": "306", "seatNo": "23", "name": "陳莨裕", "studentId": "310026"}, {"no": 27, "className": "306", "seatNo": "29", "name": "鄧名劭", "studentId": "310065"}, {"no": 28, "className": "307", "seatNo": "18", "name": "張朔源", "studentId": "310088"}, {"no": 29, "className": "307", "seatNo": "31", "name": "蔡秉睿", "studentId": "310199"}, {"no": 30, "className": "307", "seatNo": "33", "name": "賴冠叡", "studentId": "310133"}, {"no": 31, "className": "308", "seatNo": "27", "name": "黃柏睿", "studentId": "310228"}, {"no": 32, "className": "ERROR:#N/A", "seatNo": "21", "name": "薛宇廷", "studentId": "010070"}];
const GITHUB_DEFAULT={owner:'dfleoyang-HLHS',repo:'2026113',branch:'main'};const KEY='flex-seat-config-v2';const GH_KEY='flex-seat-github-v1';let cfg=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'113班',rows:6,cols:6};let ghCfg=JSON.parse(localStorage.getItem(GH_KEY)||'null')||GITHUB_DEFAULT;let order=[];let drag=null;let touchSource=null;const $=id=>document.getElementById(id);function seatCount(){return cfg.rows*cfg.cols}function defaults(){return Array.from({length:seatCount()},(_,i)=>STUDENTS[i]?.no||null)}function find(n){return STUDENTS.find(s=>s.no===n)}function save(){localStorage.setItem(KEY,JSON.stringify({...cfg,order}))}function saveGh(){localStorage.setItem(GH_KEY,JSON.stringify(ghCfg))}function render(){document.documentElement.style.setProperty('--cols',cfg.cols);$('title').textContent=cfg.name+'座位表';$('info').textContent=`${cfg.rows}排 × ${cfg.cols}列｜${STUDENTS.length}人｜班級、座號、姓名、學號來自簽到表`;let arr=order.slice(0,seatCount());while(arr.length<seatCount())arr.push(null);$('grid').innerHTML='';arr.forEach((no,i)=>{let s=find(no),e=document.createElement('div');e.className='seat '+(s?(s.gender==='男'?'boy':'girl'):'empty');e.dataset.i=i;e.innerHTML=s?`<div class="num">位置 ${Math.floor(i/cfg.cols)+1}-${i%cfg.cols+1}</div><div class="name">${s.name}</div><div class="meta">${s.className}班｜座號 ${s.seatNo}<br>學號 ${s.studentId}</div>`:'空位';if(s){e.draggable=true;e.addEventListener('dragstart',()=>{drag=i;e.classList.add('dragging')});e.addEventListener('dragend',()=>{drag=null;e.classList.remove('dragging')})}e.addEventListener('dragover',x=>{x.preventDefault();e.classList.add('over')});e.addEventListener('dragleave',()=>e.classList.remove('over'));e.addEventListener('drop',x=>{x.preventDefault();if(drag!==null&&drag!==i){[arr[drag],arr[i]]=[arr[i],arr[drag]];order=arr;save();render();$('status').textContent='已調整座位並儲存至本地'}});e.addEventListener('touchstart',touchStart,{passive:false});e.addEventListener('touchmove',touchMove,{passive:false});e.addEventListener('touchend',touchEnd,{passive:false});$('grid').appendChild(e)})}function touchStart(e){if(!e.touches[0]||this.classList.contains('empty'))return;e.preventDefault();touchSource=Number(this.dataset.i);this.classList.add('dragging')}function touchMove(e){if(touchSource===null)return;e.preventDefault();let t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.seat');document.querySelectorAll('.seat.over').forEach(x=>x.classList.remove('over'));if(el&&Number(el.dataset.i)!==touchSource)el.classList.add('over')}function touchEnd(e){if(touchSource===null)return;e.preventDefault();let t=e.changedTouches[0],el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.seat');let target=el?Number(el.dataset.i):null;document.querySelectorAll('.seat').forEach(x=>x.classList.remove('dragging','over'));if(target!==null&&target!==touchSource){[order[touchSource],order[target]]=[order[target],order[touchSource]];save();render();$('status').textContent='已調整座位並儲存至本地'}touchSource=null}
$('save').onclick=()=>{save();$('status').textContent='已儲存至本地'};$('reset').onclick=()=>{if(confirm('恢復預設排列？')){order=defaults();save();render()}};$('setup').onclick=()=>{let rows=prompt('請輸入排數（5、6或7）：',cfg.rows);if(rows===null)return;let total=prompt('請輸入座位總人數：',STUDENTS.length);if(total===null)return;rows=Math.max(1,Number(rows));total=Math.max(1,Number(total));cfg={...cfg,rows,cols:Math.ceil(total/rows)};order=defaults();save();render();$('status').textContent=`已設定 ${rows}排 × ${cfg.cols}列`};$('print').onclick=()=>window.print();$('export').onclick=()=>{if(!window.XLSX){alert('請確認網路連線後再試');return}let rows=[[cfg.name+'座位表'],['位置','學生姓名','班級','座號','學號']];order.forEach((no,i)=>{let s=find(no);if(s)rows.push([`第 ${Math.floor(i/cfg.cols)+1}排第 ${i%cfg.cols+1}列`,s.name,s.className,s.seatNo,s.studentId])});let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,'座位表');XLSX.writeFile(wb,cfg.name+'座位表.xlsx')};$('push').onclick=async()=>{if(!ghCfg.token){let t=prompt('請輸入 GitHub Personal Access Token（需 repo 權限）：','');if(!t)return;ghCfg.token=t;saveGh();}$('status').textContent='準備上傳至 GitHub...';$('status').className='status';try{let path=`seating-${cfg.name}.json`;let url=`https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${path}`;let sha='';try{let r=await fetch(url,{headers:{Authorization:`token ${ghCfg.token}`,Accept:'application/vnd.github.v3+json'}});if(r.ok){let j=await r.json();sha=j.sha||'';}else if(r.status===404){sha='new';}}catch(e){}let body={message:`更新 ${cfg.name} 座位表（自動）`,content:btoa(unescape(encodeURIComponent(JSON.stringify(order)))),branch:ghCfg.branch};if(sha&&sha!=='new')body.sha=sha;let res=await fetch(url,{method:'PUT',headers:{Authorization:`token ${ghCfg.token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){let t=await res.text();throw new Error(`HTTP ${res.status}: ${t}`);}$('status').textContent='✓ 已上傳至 GitHub！';$('status').className='status';}catch(err){console.error(err);$('status').textContent='✗ 上傳失敗：'+err.message;$('status').className='status error';alert('上傳失敗：'+err.message);}};order=JSON.parse(localStorage.getItem('flex-seat-order-v2')||'null')||defaults();render();</script></body></html>
